name: Publish APK Release

# Descarga el APK ya compilado y lo adjunta como asset descargable de la Release.
# Se lanza a mano: Actions -> Publish APK Release -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'URL del APK a publicar'
        required: false
        default: 'https://expo.dev/artifacts/eas/vTPBWxqdkEE9AecWX-LlQpjDMkbEI2NJjgoVwtcyWL0.apk'
      tag:
        description: 'Tag de la release'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish:
    name: Publicar APK en la release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Descargar el APK
        run: |
          mkdir -p dist
          curl -L --fail --retry 3 --retry-delay 5 \
            -o dist/persona-ia-1.0.0.apk "${{ github.event.inputs.apk_url }}"
          ls -lh dist/
          file dist/persona-ia-1.0.0.apk

      - name: Verificar que es un APK valido
        run: |
          SIZE=$(stat -c%s dist/persona-ia-1.0.0.apk)
          echo "Tamano: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: el archivo es demasiado pequeno, no parece un APK"
            exit 1
          fi
          unzip -l dist/persona-ia-1.0.0.apk | head -20

      - name: Crear o actualizar la release y adjuntar el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Persona IA $TAG - APK Android" \
              --notes "APK instalable de Persona IA. Requiere Android 8.0 o superior."
          fi
          gh release upload "$TAG" dist/persona-ia-1.0.0.apk --clobber
          echo "--- Assets de la release ---"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) | \(.size) bytes | \(.url)"'
