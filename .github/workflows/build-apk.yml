name: Build APK

# Compila el APK instalable de Persona IA y lo publica como Release descargable.
# Se puede lanzar a mano (pestana Actions -> Build APK -> Run workflow)
# o automaticamente al crear un tag v*.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el Android SDK preinstalado en
      # /usr/local/lib/android/sdk. NO se usa android-actions/setup-android@v3
      # porque intenta instalar el paquete "tools", que Google retiro del
      # repositorio y hace fallar el job con "Failed to find package 'tools'".
      - name: Configurar Android SDK (preinstalado en el runner)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK en: $SDK"
          ls "$SDK"
          # localizar sdkmanager (la ruta cambia segun la version de cmdline-tools)
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "No hay sdkmanager, descargando cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdline.zip -d /tmp/cmdline
            mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMGR"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          chmod +x "$SDKMGR"
          # aceptar licencias e instalar solo lo que necesita el build
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "--- paquetes instalados ---"
          "$SDKMGR" --list_installed | head -20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Generar proyecto Android nativo
        run: npx expo prebuild --clean -p android --no-install

      - name: Compilar APK de release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/persona-ia-${VERSION}.apk"
          ls -lh dist/
          echo "--- contenido 3D en el APK ---"
          unzip -l "dist/persona-ia-${VERSION}.apk" | grep -i "vtuber" || echo "AVISO: no se encontraron assets vtuber"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: persona-ia-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apk-latest' }}
          name: Persona IA ${{ env.VERSION }} - APK Android
          body: |
            APK instalable de **Persona IA** con los **personajes 3D estilo VTuber anime**.

            - Version de la app: ${{ env.VERSION }}
            - Paquete: com.personaia.app
            - Requisitos: Android 8.0 (API 26) o superior
            - Arquitecturas: arm64-v8a, armeabi-v7a
            - Incluye los 5 personajes 3D (dulce, chispa, serena, filo, musa) con
              animacion de respiracion, parpadeo, balanceo de cabeza y reaccion al hablar

            Instalacion: descarga el .apk, activa "Instalar apps de origen desconocido"
            y abre el archivo en el telefono.
          files: dist/*.apk
          draft: false
          prerelease: false
