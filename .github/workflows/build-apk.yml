name: Build APK

# Compila el APK de release de Persona IA y lo publica como release descargable.
# Se dispara manualmente (workflow_dispatch) o al crear un tag v*.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Compilar APK de release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generar proyecto Android nativo
        run: npx expo prebuild -p android --no-install

      - name: Generar keystore de release
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.keystore \
            -alias personaia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass personaia123 -keypass personaia123 \
            -dname "CN=Persona IA, OU=Dev, O=PersonaIA, L=La Paz, S=La Paz, C=BO"

      - name: Compilar APK de release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: persona-ia-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
